<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .canvas {
    width: 256px;
    height: 256px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(135% 120% at 16% 6%, #7E7CFF 0%, #6366F1 36%, #4F46E5 76%, #4338CA 100%);
  }
  .sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 44%);
    pointer-events: none;
  }
  .mono {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glyph {
    width: 176px;
    height: 176px;
    display: block;
    filter: drop-shadow(0 7px 16px rgba(40,33,120,.45));
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="sheen"></div>
    <div class="mono">
      <!-- Monogram "C" whose open mouth becomes a decision node branching into two condition outputs -->
      <svg class="glyph" viewBox="0 0 176 176" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M134 50 A60 60 0 1 0 134 126" stroke="#FFFFFF" stroke-width="21" stroke-linecap="round" fill="none"/>
        <circle cx="134" cy="88" r="16" fill="#FFFFFF"/>
        <circle cx="134" cy="88" r="6.8" fill="#4F46E5"/>
        <path d="M146 78 L156 64" stroke="#C7D2FE" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M146 98 L156 112" stroke="#C7D2FE" stroke-width="6.5" stroke-linecap="round"/>
        <circle cx="159" cy="60" r="8" fill="#C7D2FE"/>
        <circle cx="159" cy="116" r="8" fill="#C7D2FE"/>
      </svg>
    </div>
  </div>
</body>
</html>
