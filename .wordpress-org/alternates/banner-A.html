<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }
  .canvas {
    width: 1544px;
    height: 500px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(120deg, #5B4DF0 0%, #4F46E5 42%, #6D28D9 100%);
    color: #ffffff;
  }
  .bloom {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(58% 90% at 90% 16%, rgba(167,139,250,0.50) 0%, rgba(167,139,250,0) 60%),
      radial-gradient(48% 80% at 4% 94%, rgba(99,102,241,0.42) 0%, rgba(99,102,241,0) 60%);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 24%, #000 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 24%, #000 100%);
  }
  .content {
    position: absolute;
    left: 100px;
    top: 0;
    height: 100%;
    width: 760px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.13);
    border: 1px solid rgba(255,255,255,0.24);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #F1EDFF;
    margin-bottom: 28px;
  }
  .eyebrow .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #34D399;
    box-shadow: 0 0 0 4px rgba(52,211,153,0.25);
  }
  h1 {
    font-size: 78px;
    line-height: 0.98;
    font-weight: 800;
    letter-spacing: -0.024em;
  }
  h1 .l2 { display: block; }
  .woo {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #C4B5FD;
    margin-top: 16px;
    margin-bottom: 28px;
  }
  .woo strong { color: #ffffff; }
  .tagline {
    font-size: 25px;
    line-height: 1.42;
    font-weight: 500;
    color: #E9E5FF;
    max-width: 650px;
  }
  .tagline .hl { color: #ffffff; font-weight: 700; }
  .motif {
    position: absolute;
    right: 96px;
    top: 50%;
    transform: translateY(-50%);
    width: 540px;
  }
  .card {
    position: relative;
    background: rgba(255,255,255,0.98);
    border-radius: 24px;
    box-shadow: 0 44px 84px -28px rgba(23,12,80,0.7), 0 0 0 1px rgba(255,255,255,0.5);
    padding: 26px 28px 30px 28px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
  }
  .card-head .ttl {
    margin-left: 8px;
    font-size: 14px;
    font-weight: 800;
    color: #4F46E5;
    letter-spacing: 0.02em;
  }
  .tl { width: 11px; height: 11px; border-radius: 50%; }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    height: 58px;
    padding: 0 18px;
    border-radius: 14px;
    margin-left: 58px;
  }
  .row + .row { margin-top: 18px; }
  .row .grip {
    width: 14px; height: 14px; margin-right: 14px; flex: none;
    background: radial-gradient(circle, #C7C9F2 2px, transparent 2.3px) 0 0/7px 7px;
    opacity: 0.9;
  }
  .row .label { font-size: 16px; font-weight: 600; }
  .row .spacer { flex: 1; }
  .row.base { background: #EEF0FF; border: 1.5px solid #DADCFB; }
  .row.base .label { color: #3730A3; }
  .row.cond { background: #ffffff; border: 1.5px solid #ECE9FE; }
  .row.cond .label { color: #5B21B6; }
  .sel {
    display: inline-flex; align-items: center; gap: 10px;
    background: #ffffff; border: 1.5px solid #D6D8FA; border-radius: 9px;
    padding: 7px 12px; font-size: 13px; font-weight: 700; color: #4F46E5;
  }
  .sel .car { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #6366F1; }
  .toggle { width: 42px; height: 24px; border-radius: 999px; background: #6D28D9; position: relative; }
  .toggle::after { content:""; position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:#fff; }
  .pill {
    font-size: 13px; font-weight: 800; color: #047857;
    background: #D1FAE5; border-radius: 999px; padding: 6px 13px;
    border: 1.5px solid #A7F3D0;
  }
  .branch { position: absolute; left: 0; top: 0; width: 58px; height: 100%; overflow: visible; }
  .ifbadge {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 13px;
    background: linear-gradient(135deg, #6366F1, #8B5CF6);
    box-shadow: 0 10px 20px -6px rgba(79,70,229,0.75);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.02em;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="bloom"></div>
    <div class="grid"></div>
    <div class="content">
      <span class="eyebrow"><span class="dot"></span>Conditional logic &mdash; free</span>
      <h1>CoreLabs Product<span class="l2">Options</span></h1>
      <div class="woo">for <strong>WooCommerce</strong></div>
      <p class="tagline">Add custom fields, choices &amp; surcharges with a drag-and-drop builder &mdash; then <span class="hl">show, hide or require</span> them with conditional logic.</p>
    </div>
    <div class="motif">
      <div class="card">
        <div class="card-head">
          <span class="tl" style="background:#FF5F57"></span>
          <span class="tl" style="background:#FEBC2E"></span>
          <span class="tl" style="background:#28C840"></span>
          <span class="ttl">Option Builder</span>
        </div>
        <svg class="branch" viewBox="0 0 58 260" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M42 130 C 52 130, 52 46, 58 46"  stroke="#A78BFA" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
          <path d="M42 130 H 58" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
          <path d="M42 130 C 52 130, 52 214, 58 214" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="ifbadge">IF</div>
        <div class="row base">
          <span class="grip"></span>
          <span class="label">Gift wrap?</span>
          <span class="spacer"></span>
          <span class="toggle"></span>
        </div>
        <div class="row cond">
          <span class="grip"></span>
          <span class="label">Message style</span>
          <span class="spacer"></span>
          <span class="sel">Cursive <span class="car"></span></span>
        </div>
        <div class="row cond">
          <span class="grip"></span>
          <span class="label">Premium ribbon</span>
          <span class="spacer"></span>
          <span class="pill">+ $4.00</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
