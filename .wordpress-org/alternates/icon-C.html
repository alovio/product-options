<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .canvas {
    width: 256px;
    height: 256px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(150deg, #6D6BF5 0%, #5249E8 55%, #4A3FD6 100%);
    border-radius: 60px;
  }
  /* soft warm glow top-right for friendliness */
  .glow {
    position: absolute;
    width: 230px;
    height: 230px;
    top: -75px;
    right: -75px;
    background: radial-gradient(circle at center, rgba(255,176,107,0.60) 0%, rgba(255,176,107,0.0) 70%);
    border-radius: 50%;
  }
  .mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="mark">
      <svg width="164" height="164" viewBox="0 0 164 164" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#F2F1FF"/>
          </linearGradient>
          <linearGradient id="toggle" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#FFB36B"/>
            <stop offset="1" stop-color="#FF9A4D"/>
          </linearGradient>
        </defs>

        <!-- soft white rounded card holding the checklist -->
        <rect x="16" y="22" width="132" height="120" rx="32" fill="url(#card)"/>

        <!-- row 1: checked -->
        <circle cx="50" cy="58" r="16" fill="#6D6BF5"/>
        <path d="M42.5 58 l5 5 l9.5 -11.5" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="76" y="50.5" width="52" height="15" rx="7.5" fill="#D9D7FB"/>

        <!-- row 2: checked -->
        <circle cx="50" cy="106" r="16" fill="#6D6BF5"/>
        <path d="M42.5 106 l5 5 l9.5 -11.5" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="76" y="98.5" width="40" height="15" rx="7.5" fill="#D9D7FB"/>

        <!-- warm rounded toggle (conditional switch), overlapping card bottom-right -->
        <g>
          <rect x="94" y="118" width="60" height="36" rx="18" fill="url(#toggle)"/>
          <circle cx="136" cy="136" r="14" fill="#FFFFFF"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
