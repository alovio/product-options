<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .canvas {
    width: 1544px;
    height: 500px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #F7F7FF 0%, #FCFAFF 55%, #FFF6EF 100%);
    display: flex;
    align-items: center;
  }

  /* soft decorative blobs */
  .blob { position: absolute; border-radius: 50%; }
  .blob-1 {
    width: 480px; height: 480px;
    top: -160px; left: -130px;
    background: radial-gradient(circle at center, rgba(99,102,241,0.16) 0%, rgba(99,102,241,0) 70%);
  }
  .blob-2 {
    width: 540px; height: 540px;
    bottom: -220px; right: 320px;
    background: radial-gradient(circle at center, rgba(255,154,77,0.20) 0%, rgba(255,154,77,0) 70%);
  }

  /* LEFT: text block */
  .left {
    position: relative;
    z-index: 2;
    padding: 0 60px 0 96px;
    max-width: 880px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    background: #FFFFFF;
    border: 1px solid #ECEAFE;
    box-shadow: 0 6px 18px rgba(79,70,229,0.10);
    padding: 9px 20px 9px 13px;
    border-radius: 999px;
    margin-bottom: 30px;
  }
  .badge .dot {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #FFB36B, #FF9A4D);
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .badge .txt { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; color: #4F46E5; }
  .badge .for { font-size: 17px; font-weight: 600; color: #9A96C0; }

  h1 {
    margin: 0;
    font-size: 72px;
    line-height: 1.03;
    font-weight: 800;
    letter-spacing: -1.8px;
    color: #211C4A;
  }
  h1 .accent {
    background: linear-gradient(120deg, #6D6BF5 0%, #8B5CF6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin: 18px 0 0;
    font-size: 23px;
    line-height: 1.45;
    font-weight: 600;
    color: #6A6595;
    max-width: 600px;
  }
  .sub b { color: #FF8A3D; font-weight: 800; }
  .pill-row { margin-top: 36px; display: flex; gap: 14px; }
  .pill {
    font-size: 16px;
    font-weight: 700;
    color: #4A4470;
    background: #FFFFFF;
    border: 1px solid #EEECFB;
    border-radius: 999px;
    padding: 11px 20px;
    box-shadow: 0 4px 12px rgba(33,28,74,0.05);
    white-space: nowrap;
  }
  .pill .tick { color: #5249E8; margin-right: 8px; font-weight: 800; }

  /* RIGHT: builder motif */
  .right {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .builder { position: relative; width: 470px; height: 360px; }
  .card {
    position: absolute;
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 22px 48px rgba(40,33,99,0.14);
    display: flex;
    align-items: center;
    padding: 0 22px;
    border: 1px solid #F0EEFB;
  }
  .row1 { top: 8px; left: 0; width: 300px; height: 86px; }
  .row2 { top: 138px; left: 0; width: 300px; height: 86px; }
  .row3 { top: 268px; left: 150px; width: 300px; height: 86px; }

  .chk {
    width: 42px; height: 42px; border-radius: 14px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    margin-right: 18px;
  }
  .chk-on { background: #6D6BF5; }
  .lines { flex: 1; }
  .ln { height: 11px; border-radius: 6px; background: #E7E5FA; }
  .ln.short { width: 60%; margin-top: 9px; background: #F0EFFB; }

  /* warm rounded toggle on a row */
  .toggle {
    width: 60px; height: 34px; border-radius: 999px;
    flex: 0 0 auto; margin-left: 14px;
    background: linear-gradient(135deg, #FFB36B, #FF9A4D);
    position: relative;
  }
  .toggle::after {
    content: "";
    position: absolute; top: 5px; right: 5px;
    width: 24px; height: 24px; border-radius: 50%;
    background: #FFFFFF;
  }
  .toggle.off { background: #E3E1F2; }
  .toggle.off::after { right: auto; left: 5px; }

  /* connector svg sits behind cards */
  .wires { position: absolute; inset: 0; z-index: -1; overflow: visible; }
  .node {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #FF9A4D;
    border: 3px solid #FFFFFF;
    box-shadow: 0 2px 6px rgba(255,138,61,0.4);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="left">
      <div class="badge">
        <span class="dot">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2 l2.4 2.4 L10 2.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="txt">Conditional logic, free</span>
        <span class="for">&middot;&nbsp; for WooCommerce</span>
      </div>

      <h1>Conditional Product<br><span class="accent">Options</span></h1>

      <p class="sub">Add custom fields, choices &amp; surcharges with <b>show / hide / require</b> rules &mdash; no code, just drag &amp; drop.</p>

      <div class="pill-row">
        <span class="pill"><span class="tick">&#10003;</span>Drag-and-drop builder</span>
        <span class="pill"><span class="tick">&#10003;</span>Conditional rules</span>
        <span class="pill"><span class="tick">&#10003;</span>Price surcharges</span>
      </div>
    </div>

    <div class="right">
      <div class="builder">
        <!-- connector wires -->
        <svg class="wires" viewBox="0 0 470 360" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M300 51 C 358 51, 300 181, 300 181" stroke="#FFC79A" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
          <path d="M300 181 C 378 181, 320 311, 300 311" stroke="#C9C6F7" stroke-width="4" stroke-linecap="round"/>
        </svg>

        <!-- row 1: checkbox on + warm toggle -->
        <div class="card row1">
          <div class="chk chk-on">
            <svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 11.5 l4 4 L17 6.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="lines">
            <div class="ln" style="width:78%"></div>
            <div class="ln short"></div>
          </div>
          <div class="toggle"></div>
        </div>

        <!-- row 2: condition trigger -->
        <div class="card row2">
          <div class="chk chk-on">
            <svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 11.5 l4 4 L17 6.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="lines">
            <div class="ln" style="width:64%"></div>
            <div class="ln short"></div>
          </div>
          <div class="toggle off"></div>
        </div>

        <!-- row 3: revealed by condition -->
        <div class="card row3">
          <div class="chk" style="background:#FFF1E6;">
            <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 4 v12 M4 10 h12" stroke="#FF9A4D" stroke-width="3" stroke-linecap="round"/></svg>
          </div>
          <div class="lines">
            <div class="ln" style="width:70%"></div>
            <div class="ln short"></div>
          </div>
        </div>

        <!-- condition nodes -->
        <div class="node" style="top:43px; left:292px;"></div>
        <div class="node" style="top:173px; left:292px; background:#6D6BF5; box-shadow:0 2px 6px rgba(99,102,241,0.45);"></div>
        <div class="node" style="top:303px; left:142px;"></div>
      </div>
    </div>
  </div>
</body>
</html>
